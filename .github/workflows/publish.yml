name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    # Every day at 14:17 UTC (about 7am Pacific), after the Monday and Friday crawls.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Where the site lives on autographhero.com. "/new" while testing.
  # To go live at the root, set this to "" and point the FTP account at public_html.
  SITE_PATH: /new
  # Keeps the test copy out of Google. Set to '0' when the site goes live.
  SITE_NOINDEX: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build from Supabase
        run: node build.mjs
        env:
          BASE_PATH: ${{ env.SITE_PATH }}

      - name: Check for Bluehost login
        id: login
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Site built but not uploaded. Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to publish to Bluehost."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploads into the FTP account's own folder. Create that account in Bluehost
      # with its directory set to the site folder, so it cannot touch anything else.
      - name: Upload to Bluehost
        if: steps.login.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-allow true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            mirror --reverse --no-perms --verbose=1 --exclude-glob signing/ dist/ ./;
            mirror --reverse --delete --no-perms --verbose=1 dist/signing/ ./signing/;
            quit"
