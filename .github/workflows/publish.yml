name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    # Every day at 14:17 UTC (about 7am Pacific), after the Monday and Friday crawls.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build from Supabase
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Keeps the preview out of Google. Remove once this replaces autographhero.com.
          SITE_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
