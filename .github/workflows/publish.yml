name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    # Every hour at :17, so approved listings and crawl results show up within the hour.
    - cron: '17 * * * *'
    # Every 10 minutes: publish only if a listing was approved since the last check, so approvals
    # go live within minutes (the signer's team lookup runs at approval and is done by then).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Where the site lives on autographhero.com: "" = the domain root (live since Oct 25, 2026).
  # The FTP account's folder must match (public_html for the root).
  SITE_PATH: ''
  # '1' keeps a test copy out of Google; '0' = live and indexed.
  SITE_NOINDEX: '0'

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Anything newly approved?
        id: check
        env:
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "17 * * * *" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          since=$(date -u -d '-15 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(curl -sS --max-time 30 "https://ravavlocylqvkmthevtv.supabase.co/rest/v1/submissions?select=id&status=eq.approved&reviewed_at=gte.${since}" \
                -H "apikey: $SUPABASE_READ_KEY" | grep -o '"id"' | wc -l)
          echo "approved since $since: $n"
          if [ "$n" -gt 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # One publish at a time (on the job, so the 10-minute checks never bump a queued hourly build).
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Looks up free Wikimedia Commons photos for players not checked yet (up to 50 per run).
      # Uses the project's public key; the lookup runs in the Supabase function "athlete-photos".
      - name: Find free player photos
        continue-on-error: true
        run: |
          for i in 1 2; do
            curl -sS --max-time 120 -X POST "https://ravavlocylqvkmthevtv.supabase.co/functions/v1/athlete-photos" \
              -H "Authorization: Bearer $SUPABASE_ANON_JWT" -H "apikey: $SUPABASE_ANON_JWT"
            echo
          done
        env:
          SUPABASE_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhdmF2bG9jeWxxdmttdGhldnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODIyMzMsImV4cCI6MjEwNjQ1ODIzM30.MwlzxfiwlGTW9BJ-TzaRSGldWQhegtOFsvFbvqqpsQk

      - name: Build from Supabase
        run: node build.mjs
        env:
          BASE_PATH: ${{ env.SITE_PATH }}
          # Supabase secret key (Settings → API Keys → Secret keys) so the build can read signings
          # after public reads are switched off. Empty = the public key.
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
          # Cloudflare Turnstile site key (public). Set it under Settings → Secrets and
          # variables → Actions → Variables. Empty = no check on "Submit a signing".
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          # Cloudflare Web Analytics token (public, from the JS snippet). Empty = no analytics.
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          ADS: ${{ vars.ADS }}
          # Contact address shown on the Terms and Privacy pages.
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Search engine ownership codes (public), from Google Search Console / Bing Webmaster Tools.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      # Keeps the latest built site on the "built-site" branch (one commit, replaced
      # each run). Useful for previews, or to upload to Bluehost by hand.
      - name: Save the built site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b built-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from Supabase on $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" built-site

      - name: Check for Bluehost login
        id: login
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Site built but not uploaded. Add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to publish to Bluehost."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploads into the FTP account's own folder. Create that account in Bluehost
      # with its directory set to the site folder, so it cannot touch anything else.
      - name: Upload to Bluehost
        if: steps.login.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Bluehost's FTP certificate is issued for the shared server's name, not for
          # the account hostname, so the name check fails. This trusts that one
          # certificate by its fingerprint (the connection stays encrypted; any other
          # certificate is still refused). When Bluehost renews it, the upload fails with
          # "certificate common name doesn't match" and shows the new fingerprint in
          # brackets: put it in a repository variable named FTP_CERT_FINGERPRINT.
          FTP_CERT_FINGERPRINT: ${{ vars.FTP_CERT_FINGERPRINT || '1D:A4:47:AF:66:EC:58:06:8E:2B:AB:4C:38:BF:23:24:2B:26:D1:2D' }}
        # Only changed files are sent. Every build rewrites every page, so lftp's
        # size+time check saw all ~4,500 files as new, the upload took over an hour,
        # and one dropped transfer failed the whole job. Now each upload ends by
        # saving .deploy-manifest (a hash of every file) on Bluehost; the next run
        # sends only files whose hash changed and deletes files that went away. If
        # an upload fails, the manifest isn't replaced, so the next run sends the
        # same files again. No manifest on Bluehost (first run, or delete it to
        # force one) = upload everything the old way.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          SETTINGS="set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true;
            set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no; set ftp:passive-mode true;
            set net:max-retries 5; set net:reconnect-interval-base 10; set net:timeout 60; set cmd:fail-exit yes;"
          ftp() { lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "$SETTINGS $1 quit"; }

          (cd dist && find . -type f -not -path './.git/*' -not -name .deploy-manifest -print0 \
            | sort -z | xargs -0 sha1sum) | sort -k2 > new-manifest
          ftp "get .deploy-manifest -o old-manifest;" >/dev/null 2>&1 || true
          [ -f old-manifest ] || : > old-manifest
          echo "files in build: $(wc -l < new-manifest); in last upload: $(wc -l < old-manifest)"

          if [ ! -s old-manifest ]; then
            echo "No manifest on Bluehost: uploading everything."
            ftp "rm -r -f .git;
              mirror --reverse --no-perms --parallel=4 --verbose=1 --exclude-glob signing/ --exclude-glob .git/ dist/ ./;
              mirror --reverse --delete --no-perms --parallel=4 --verbose=1 dist/signing/ ./signing/;"
          else
            comm -13 <(sort old-manifest) <(sort new-manifest) | cut -c43- > changed
            comm -23 <(cut -c43- old-manifest | sort) <(cut -c43- new-manifest | sort) > removed
            echo "changed: $(wc -l < changed); removed: $(wc -l < removed)"
            mkdir stage
            while IFS= read -r p; do mkdir -p "stage/$(dirname "$p")"; cp "dist/$p" "stage/$p"; done < changed
            : > deletes
            while IFS= read -r p; do printf 'rm -f "%s";\n' "${p#./}" >> deletes; done < removed
            if [ -s changed ] || [ -s removed ]; then
              ftp "rm -r -f .git; $(cat deletes) $( [ -s changed ] && echo 'mirror --reverse --no-perms --parallel=4 --verbose=1 stage/ ./;' )"
            fi
          fi
          cp new-manifest dist/.deploy-manifest
          ftp "put dist/.deploy-manifest -o .deploy-manifest;"

      # Writes a short report to the "deploy-check" branch: which top-level names are in
      # the FTP folder, and what the site returns from Bluehost directly (skipping
      # Cloudflare) and through Cloudflare. No logins, paths or IP addresses are written.
      - name: Check what visitors get
        if: steps.login.outputs.ready == 'true'
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_CERT_FINGERPRINT: ${{ vars.FTP_CERT_FINGERPRINT || '1D:A4:47:AF:66:EC:58:06:8E:2B:AB:4C:38:BF:23:24:2B:26:D1:2D' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/check && cd /tmp/check
          {
            echo "Run: $(date -u +%FT%TZ)"
            echo "## Build"
            cat "$GITHUB_WORKSPACE/build-info.txt" 2>/dev/null || echo "no build info"
            echo "## Names in the FTP folder"
            lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
              set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true;
              set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no; set ftp:passive-mode true;
              cls -1a; quit" 2>&1 | sed 's#/$##; s#.*/##' | sort | head -60
            echo "## Is this the WordPress folder? (wp-config.php present)"
            lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
              set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true;
              set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no; set ftp:passive-mode true;
              cls -1 wp-config.php; quit" >/dev/null 2>&1 && echo yes || echo no
            ORIGIN_IP=$(getent ahostsv4 "$FTP_SERVER" | awk 'NR==1{print $1}')
            for p in / /terms/ /admin/ /new/ /sitemap.xml; do
              for via in origin cloudflare; do
                if [ "$via" = origin ]; then R="--resolve autographhero.com:443:$ORIGIN_IP"; else R=""; fi
                curl -sk -m 20 $R -A "Mozilla/5.0 deploy-check" -o body -D hdr "https://autographhero.com$p" || true
                echo "## $p via $via"
                grep -iE '^HTTP/|^location:|^cache-control:|^cf-cache-status:|^age:|^x-.*cache' hdr | tr -d '\r'
                grep -o '<title>[^<]*' body | head -1
                grep -o 'Updated [A-Za-z]*, [A-Za-z]* [0-9]*, 20[0-9]*' body | head -1
                grep -c 'wp-content' body | sed 's/^/wp-content mentions: /'
              done
            done
            # www should forward to the main address; AI training crawlers should get 403 on both names.
            for h in autographhero.com www.autographhero.com; do
              for ua in "Mozilla/5.0 deploy-check" "Mozilla/5.0 (compatible; GPTBot/1.2; +https://openai.com/gptbot)" "Mozilla/5.0 (compatible; ChatGPT-User/1.0; +https://openai.com/bot)"; do
                curl -sk -m 20 -A "$ua" -o /dev/null -D hdr "https://$h/events/" || true
                echo "## $h/events/ as $(echo "$ua" | grep -oE 'GPTBot|ChatGPT-User|deploy-check')"
                grep -iE '^HTTP/|^location:' hdr | tr -d '\r'
              done
            done
          } > report.txt 2>&1
          git init -q -b deploy-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.txt && git commit -q -m "Deploy check" 
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-check
