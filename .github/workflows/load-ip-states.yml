# Loads public.ip_states (US IP -> state, DB-IP Lite, CC BY 4.0) for the admin "Top 5 states" list.
# Runs when this file or the script changes, and by hand. Re-run every few months to refresh.
name: Load IP states
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/load-ip-states.mjs', '.github/workflows/load-ip-states.yml']
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/load-ip-states.mjs
        env:
          SUPABASE_READ_KEY: ${{ secrets.SUPABASE_READ_KEY }}
